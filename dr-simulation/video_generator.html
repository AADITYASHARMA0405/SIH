<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>RetinaAI Video Generator</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#000;overflow:hidden;font-family:'Segoe UI',sans-serif;color:#fff;}
canvas{display:block;}
#status{position:fixed;top:10px;left:10px;background:rgba(0,0,0,0.8);padding:10px 20px;border-radius:8px;font-size:14px;z-index:100;color:#06b6d4;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="status">Loading assets...</div>
<script>
const C=document.getElementById('c'),X=C.getContext('2d');
const W=1920,H=1080;
C.width=W;C.height=H;
C.style.width='100vw';C.style.height='100vh';

let frame=0,scene=0,sceneFrame=0,recording=false,recorder,chunks=[];

// Images
const doctorImg=new Image();doctorImg.src='doctor_fundoscopy.png';
const fundusImg=new Image();fundusImg.src='fundus_moderate.jpg';
const fundusNorm=new Image();fundusNorm.src='fundus_normal.jpg';
const fundusSev=new Image();fundusSev.src='fundus_severe.jpg';
const confMatImg=new Image();confMatImg.src='confusion_matrix.png';
const rocImg=new Image();rocImg.src='roc_curve.png';
const trainImg=new Image();trainImg.src='training_history.png';

let loadedCount=0;
const totalImages=7;
[doctorImg,fundusImg,fundusNorm,fundusSev,confMatImg,rocImg,trainImg].forEach(img=>{
  img.onload=()=>{loadedCount++;if(loadedCount>=totalImages)startGeneration();};
  img.onerror=()=>{loadedCount++;if(loadedCount>=totalImages)startGeneration();};
});

// Scene durations (frames at 60fps)
// Scene 0: Fundoscopy 180f=3s | Scene 1: Acquisition 300f=5s | Scene 2: Track 300f=5s
// Scene 3: Interpretability 300f=5s | Scene 4: Simulink+Report 300f=5s | Scene 5: Closing 180f=3s
const sceneDurations=[180,300,300,300,300,180];
const totalFrames=sceneDurations.reduce((a,b)=>a+b,0);

// ─── UTILITIES ───
function ease(t){return t<0.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;}
function easeOut(t){return 1-Math.pow(1-Math.max(0,Math.min(1,t)),3);}
function lerp(a,b,t){return a+(b-a)*Math.max(0,Math.min(1,t));}

function fadeText(text,x,y,size,color,alpha,align='center',weight='600',font='Segoe UI'){
  if(alpha<=0)return;
  X.save();X.globalAlpha=Math.max(0,Math.min(1,alpha));
  X.font=`${weight} ${size}px '${font}',sans-serif`;
  X.fillStyle=color;X.textAlign=align;X.textBaseline='middle';
  X.fillText(text,x,y);X.restore();
}

function drawGlow(x,y,r,color,alpha=0.3){
  const g=X.createRadialGradient(x,y,0,x,y,r);
  g.addColorStop(0,color.replace(')',`,${alpha})`).replace('rgb','rgba'));
  g.addColorStop(1,'rgba(0,0,0,0)');
  X.fillStyle=g;X.fillRect(x-r,y-r,r*2,r*2);
}

function roundRect(x,y,w,h,r){
  X.beginPath();X.moveTo(x+r,y);X.lineTo(x+w-r,y);X.quadraticCurveTo(x+w,y,x+w,y+r);
  X.lineTo(x+w,y+h-r);X.quadraticCurveTo(x+w,y+h,x+w-r,y+h);X.lineTo(x+r,y+h);
  X.quadraticCurveTo(x,y+h,x,y+h-r);X.lineTo(x,y+r);X.quadraticCurveTo(x,y,x+r,y);X.closePath();
}

function drawGlass(x,y,w,h,r=16,alpha=1,bc='rgba(255,255,255,0.08)',bg='rgba(15,23,42,0.6)'){
  X.save();X.globalAlpha=Math.max(0,alpha);
  X.fillStyle=bg;roundRect(x,y,w,h,r);X.fill();
  X.strokeStyle=bc;X.lineWidth=1.5;roundRect(x,y,w,h,r);X.stroke();X.restore();
}

function drawBar(x,y,w,h,fill,color,bg='rgba(255,255,255,0.06)'){
  X.fillStyle=bg;roundRect(x,y,w,h,h/2);X.fill();
  if(fill>0){
    const grd=X.createLinearGradient(x,y,x+w*fill,y);
    grd.addColorStop(0,color);grd.addColorStop(1,color.replace('1)','0.6)'));
    X.fillStyle=grd;roundRect(x,y,w*fill,h,h/2);X.fill();
  }
}

function drawCircleFundus(x,y,r,img,alpha=1){
  if(alpha<=0||!img.complete||img.naturalWidth<=0)return;
  X.save();X.globalAlpha=Math.max(0,alpha);
  X.beginPath();X.arc(x,y,r,0,Math.PI*2);X.clip();
  X.drawImage(img,x-r,y-r,r*2,r*2);
  X.restore();
  X.save();X.globalAlpha=Math.max(0,alpha)*0.5;
  X.strokeStyle='rgba(6,182,212,0.4)';X.lineWidth=3;
  X.beginPath();X.arc(x,y,r,0,Math.PI*2);X.stroke();X.restore();
}

function drawFlowArrow(x1,y1,x2,y2,alpha,color='#06b6d4'){
  if(alpha<=0)return;
  X.save();X.globalAlpha=alpha;
  X.strokeStyle=color;X.lineWidth=2.5;X.setLineDash([10,8]);X.lineDashOffset=-frame*2;
  X.beginPath();X.moveTo(x1,y1);X.lineTo(x2,y2);X.stroke();X.setLineDash([]);
  const a=Math.atan2(y2-y1,x2-x1);
  X.fillStyle=color;X.beginPath();
  X.moveTo(x2,y2);X.lineTo(x2-14*Math.cos(a-0.4),y2-14*Math.sin(a-0.4));
  X.lineTo(x2-14*Math.cos(a+0.4),y2-14*Math.sin(a+0.4));X.fill();
  const prog=(frame*0.02)%1;
  const dx=lerp(x1,x2,prog),dy=lerp(y1,y2,prog);
  X.fillStyle=color;X.shadowColor=color;X.shadowBlur=8;
  X.beginPath();X.arc(dx,dy,4,0,7);X.fill();X.shadowBlur=0;
  X.restore();
}

function drawPulseRing(x,y,r,color,alpha=0.3){
  const p=(frame%90)/90;
  X.save();X.globalAlpha=alpha*(1-p);
  X.strokeStyle=color;X.lineWidth=2;
  X.beginPath();X.arc(x,y,r+p*40,0,Math.PI*2);X.stroke();X.restore();
}

function drawBg(){
  // Dark blue gradient background
  const bg=X.createRadialGradient(W*0.5,H*0.5,0,W*0.5,H*0.5,W*0.7);
  bg.addColorStop(0,'#0c1929');bg.addColorStop(1,'#030712');
  X.fillStyle=bg;X.fillRect(0,0,W,H);
  // Subtle ambient glows
  drawGlow(W*0.15,H*0.25,400,'rgb(6,50,100)',0.15);
  drawGlow(W*0.85,H*0.75,350,'rgb(6,80,120)',0.1);
  drawGlow(W*0.5,H*0.5,500,'rgb(10,30,60)',0.08);
  // Background particles (subtle)
  for(let i=0;i<30;i++){
    const px=((frame*0.3+i*67)%W);
    const py=((frame*0.2+i*43)%H);
    X.save();X.globalAlpha=0.15+Math.sin(frame*0.02+i)*0.08;
    X.fillStyle='#1e3a5f';X.beginPath();X.arc(px,py,1.5,0,7);X.fill();X.restore();
  }
}

// ─── SCENE 0: FUNDOSCOPY INTRO (Kept same concept) ───
function scene0_doctor(t){
  const zoomStart=0.5,zoomEnd=0.8,flashStart=0.85;
  
  if(doctorImg.complete&&doctorImg.naturalWidth>0){
    const imgAspect=doctorImg.naturalWidth/doctorImg.naturalHeight;
    let baseW,baseH;
    if(W/H>imgAspect){baseH=H*0.82;baseW=baseH*imgAspect;}
    else{baseW=W*0.55;baseH=baseW/imgAspect;}
    
    let scale=1,offsetX=0,offsetY=0,imgAlpha=1;
    if(t>zoomStart&&t<=zoomEnd){
      const zp=easeOut((t-zoomStart)/(zoomEnd-zoomStart));
      scale=1+zp*3;offsetY=baseH*0.28*zp;
    }else if(t>zoomEnd){
      scale=4;offsetY=baseH*0.28;
      imgAlpha=Math.max(0,1-(t-flashStart)*8);
    }
    
    const revealT=easeOut(Math.min(1,t*2.5));
    const imgX=W/2-baseW/2+offsetX;
    const imgY=H/2-baseH/2+25+offsetY;
    
    drawGlow(W/2,H/2,Math.max(baseW,baseH)*0.8,'rgb(6,182,212)',0.08*revealT);
    
    X.save();
    X.globalAlpha=Math.min(revealT,imgAlpha);
    X.translate(W/2,H/2);X.scale(scale,scale);X.translate(-W/2,-H/2);
    roundRect(imgX,imgY,baseW,baseH,24/scale);X.clip();
    X.drawImage(doctorImg,imgX,imgY,baseW,baseH);
    X.restore();
    
    if(t<zoomStart+0.1){
      X.save();X.globalAlpha=revealT*0.5*(1-easeOut((t-zoomStart)*5));
      X.strokeStyle='rgba(6,182,212,0.3)';X.lineWidth=2;
      roundRect(imgX,imgY,baseW,baseH,24);X.stroke();X.restore();
    }
    
    if(t>0.15&&t<zoomEnd){
      const slitX=W/2,slitY=H/2-baseH*0.05;
      const pa=easeOut((t-0.15)*3)*(1-easeOut((t-zoomStart)*3));
      drawPulseRing(slitX,slitY,25,'#06b6d4',0.2*pa);
      drawPulseRing(slitX,slitY,50,'#3b82f6',0.12*pa);
      
      if(t>0.25){
        const aa=easeOut((t-0.25)*3)*pa;
        X.save();X.globalAlpha=aa;X.strokeStyle='rgba(6,182,212,0.5)';X.lineWidth=1;X.setLineDash([4,4]);
        X.beginPath();X.moveTo(slitX+10,slitY-20);X.lineTo(slitX+150,slitY-70);X.stroke();X.setLineDash([]);
        X.restore();
        drawGlass(slitX+150,slitY-100,220,55,12,aa,'rgba(6,182,212,0.3)','rgba(6,182,212,0.06)');
        fadeText('Slit-lamp Biomicroscope',slitX+260,slitY-72,16,'#67e8f9',aa);
      }
    }
    
    if(t>zoomStart&&t<flashStart){
      const ci=easeOut((t-zoomStart)*3);
      const blink=Math.sin(frame*0.2)>0?1:0.4;
      X.save();X.globalAlpha=ci*blink;
      X.fillStyle='#ef4444';X.beginPath();X.arc(W-100,70,8,0,7);X.fill();X.restore();
      fadeText('● REC',W-70,70,16,'#ef4444',ci*blink,'left','700');
      fadeText('Capturing retinal image…',W/2,H-60,20,'#67e8f9',ci);
    }
  }
  
  const titleFade=t<zoomStart?1:Math.max(0,1-(t-zoomStart)*5);
  const ta=easeOut(Math.min(1,(t-0.03)*2.5))*titleFade;
  fadeText('Fundoscopy Examination',W/2,65,40,'#f8fafc',ta,'center','700');
  fadeText('The ophthalmologist examines the patient\'s retina through a slit-lamp biomicroscope',W/2,110,18,'#94a3b8',ta*0.8,'center','400');
  
  if(t>0.3&&t<zoomStart){
    const ba=easeOut((t-0.3)*3);
    const steps=['Capture','Quality','CLAHE','Segment','Classify','Explain','Report'];
    const colors=['#3b82f6','#10b981','#8b5cf6','#06b6d4','#f97316','#ec4899','#3b82f6'];
    const totalSW=steps.length*110+(steps.length-1)*15;
    const startX=W/2-totalSW/2;
    steps.forEach((s,i)=>{
      const sa=easeOut((t-0.3-i*0.015)*4)*ba;
      const sx=startX+i*125+55;
      drawGlass(sx-50,H-100,100,42,20,sa,`${colors[i]}44`,`${colors[i]}0D`);
      fadeText(s,sx,H-78,13,colors[i],sa,'center','600');
      if(i<steps.length-1){
        X.save();X.globalAlpha=sa*0.4;X.strokeStyle='rgba(255,255,255,0.3)';X.lineWidth=1;
        X.beginPath();X.moveTo(sx+52,H-78);X.lineTo(sx+73,H-78);X.stroke();X.restore();
      }
    });
  }
  
  if(t>flashStart){
    const fp=(t-flashStart)/(1-flashStart);
    X.fillStyle=`rgba(255,255,255,${easeOut(fp)})`;X.fillRect(0,0,W,H);
  }
}

// ─── SCENE 1: MODULE 1 — ACQUISITION TO PREPROCESSING ───
function scene1_acquisition(t){
  // White flash fade-out
  if(t<0.08){X.fillStyle=`rgba(255,255,255,${1-easeOut(t*12)})`;X.fillRect(0,0,W,H);}
  
  const ha=easeOut(Math.min(1,t*3));
  
  // Module title
  fadeText('Module 1: Acquisition to Preprocessing Flow',W/2,50,32,'#f8fafc',ha,'center','700');
  
  // Main container glass panel
  drawGlass(40,80,W-80,H-120,20,ha*0.3,'rgba(6,182,212,0.15)','rgba(10,25,50,0.4)');
  
  // "Image Quality Assessment" box at top center
  if(t>0.05){
    const qa=easeOut((t-0.05)*3);
    drawGlass(W*0.3,100,W*0.4,50,12,qa,'rgba(6,182,212,0.4)','rgba(6,182,212,0.12)');
    fadeText('Image Quality Assessment',W/2,125,20,'#67e8f9',qa,'center','700');
    // Down arrow from quality assessment
    drawFlowArrow(W/2,150,W/2,200,qa*0.6,'#06b6d4');
  }
  
  // Left: Large circular fundus image with scanning line
  const fx=320,fy=500,fr=200;
  if(t>0.08){
    const fa=easeOut((t-0.08)*3);
    drawCircleFundus(fx,fy,fr*fa,fundusImg,fa);
    
    // Down arrow from quality to fundus
    drawFlowArrow(W*0.35,150,fx,fy-fr-20,fa*0.5,'#06b6d4');
    
    // Scanning highlight line
    if(t<0.5){
      const scanY=fy-fr+(t/0.5)*fr*2;
      X.save();X.globalAlpha=0.7*fa;X.strokeStyle='#06b6d4';X.lineWidth=3;
      X.beginPath();X.arc(fx,fy,fr,0,Math.PI*2);X.clip();
      X.beginPath();X.moveTo(fx-fr,scanY);X.lineTo(fx+fr,scanY);X.stroke();
      const sGrd=X.createLinearGradient(fx,scanY-40,fx,scanY);
      sGrd.addColorStop(0,'rgba(6,182,212,0)');sGrd.addColorStop(1,'rgba(6,182,212,0.2)');
      X.fillStyle=sGrd;X.fillRect(fx-fr,scanY-40,fr*2,40);
      X.restore();
    }
    
    // Quality check marks below fundus
    if(t>0.2){
      const checks=[{l:'Focus',d:0.2},{l:'Illumination',d:0.28},{l:'FOV',d:0.36}];
      checks.forEach((c,i)=>{
        const ca=easeOut((t-c.d)*4);
        const cy=fy+fr*0.5+i*45;
        const cx2=fx-70;
        fadeText('✓',cx2,cy,24,'#10b981',ca,'center','700');
        fadeText(c.l,cx2+30,cy,18,'#e2e8f0',ca,'left','600');
      });
    }
  }
  
  // Center: Processing device / Hybrid DL Track visual
  if(t>0.3){
    const da=easeOut((t-0.3)*2.5);
    const dx=W*0.5,dy=450;
    
    // Arrow from fundus to processing
    drawFlowArrow(fx+fr+20,fy,dx-100,dy,da*0.5,'#06b6d4');
    
    // Processing "device" — stylized rectangle with scan lines
    drawGlass(dx-90,dy-120,180,240,16,da,'rgba(6,182,212,0.3)','rgba(8,20,45,0.85)');
    
    // Inner fundus (being processed)
    if(fundusImg.complete&&fundusImg.naturalWidth>0){
      X.save();X.globalAlpha=da*0.7;
      roundRect(dx-60,dy-90,120,120,10);X.clip();
      X.drawImage(fundusImg,dx-60,dy-90,120,120);
      // Scan overlay
      X.globalCompositeOperation='screen';
      const scanGrd=X.createLinearGradient(dx-60,dy-90,dx+60,dy+30);
      scanGrd.addColorStop(0,'rgba(6,182,212,0)');
      scanGrd.addColorStop(0.4+Math.sin(frame*0.05)*0.1,'rgba(6,182,212,0.3)');
      scanGrd.addColorStop(1,'rgba(6,182,212,0)');
      X.fillStyle=scanGrd;X.fillRect(dx-60,dy-90,120,120);
      X.restore();
    }
    
    // Data streams (vertical lines below device)
    for(let i=0;i<8;i++){
      const lx=dx-35+i*10;
      const la=da*0.4*Math.abs(Math.sin(frame*0.1+i));
      X.save();X.globalAlpha=la;X.strokeStyle='#06b6d4';X.lineWidth=1.5;
      X.beginPath();X.moveTo(lx,dy+40);X.lineTo(lx,dy+80);X.stroke();X.restore();
    }
    
    // "Hybrid DL Track" label
    drawGlass(dx-80,dy+90,160,36,18,da,'rgba(16,185,129,0.5)','rgba(16,185,129,0.12)');
    fadeText('Hybrid DL Track',dx,dy+108,14,'#10b981',da,'center','700');
    
    // Down arrow
    if(t>0.5){
      drawFlowArrow(dx,dy+130,dx,dy+180,easeOut((t-0.5)*3)*0.5,'#10b981');
      fadeText('Denoising Preprocessing to Processing',dx,dy+200,14,'#94a3b8',easeOut((t-0.55)*3)*0.6);
    }
  }
  
  // Right: Preprocessing sliders
  if(t>0.4){
    const sa=easeOut((t-0.4)*2.5);
    const sx=W*0.72,sy=220;
    
    // Arrow from quality assessment to sliders
    drawFlowArrow(W*0.65,150,sx,sy-20,sa*0.5,'#06b6d4');
    
    drawGlass(sx-20,sy,W*0.25,300,16,sa,'rgba(255,255,255,0.06)','rgba(15,23,42,0.7)');
    fadeText('Module 1',sx+W*0.125-20,sy+30,22,'#f8fafc',sa,'center','700');
    
    // CLAHE slider
    const sliders=[
      {l:'CLAHE',v:100,pct:1.0,d:0.45,c:'#06b6d4'},
      {l:'Denoising',v:0,pct:0.0,d:0.52,c:'#06b6d4'},
      {l:'Enhancement',v:50,pct:0.5,d:0.59,c:'#06b6d4'}
    ];
    sliders.forEach((sl,i)=>{
      const sla=easeOut((t-sl.d)*3);
      const sly=sy+80+i*75;
      fadeText(sl.l,sx,sly,16,'#e2e8f0',sla,'left','600');
      fadeText(String(sl.v)+(sl.v===100?'%':''),sx+W*0.25-40,sly,16,'#f8fafc',sla,'right','700');
      // Slider track
      const trackX=sx,trackY=sly+25,trackW=W*0.21,trackH=8;
      X.save();X.globalAlpha=sla;
      X.fillStyle='rgba(255,255,255,0.08)';roundRect(trackX,trackY,trackW,trackH,4);X.fill();
      const fillW=trackW*easeOut((t-sl.d-0.05)*2)*sl.pct;
      if(fillW>0){
        X.fillStyle=sl.c;roundRect(trackX,trackY,fillW,trackH,4);X.fill();
      }
      // Slider knob
      const knobX=trackX+fillW;
      X.fillStyle='#fff';X.shadowColor=sl.c;X.shadowBlur=8;
      X.beginPath();X.arc(knobX,trackY+4,8,0,7);X.fill();X.shadowBlur=0;
      X.restore();
    });
  }
  
  // Sparkle decoration (bottom right)
  if(t>0.6){
    const spa=easeOut((t-0.6)*2);
    const spx=W-120,spy=H-120;
    const spSize=20+Math.sin(frame*0.08)*5;
    X.save();X.globalAlpha=spa*0.6;X.strokeStyle='#e2e8f0';X.lineWidth=2;
    X.beginPath();X.moveTo(spx-spSize,spy);X.lineTo(spx+spSize,spy);X.stroke();
    X.beginPath();X.moveTo(spx,spy-spSize);X.lineTo(spx,spy+spSize);X.stroke();
    X.beginPath();X.moveTo(spx-spSize*0.6,spy-spSize*0.6);X.lineTo(spx+spSize*0.6,spy+spSize*0.6);X.stroke();
    X.beginPath();X.moveTo(spx+spSize*0.6,spy-spSize*0.6);X.lineTo(spx-spSize*0.6,spy+spSize*0.6);X.stroke();
    X.restore();
  }
}

// ─── SCENE 2: MODULE 2 — TRACK ANALYSIS PIPELINE ───
function scene2_tracks(t){
  const ha=easeOut(Math.min(1,t*3));
  
  fadeText('Track Analysis Pipeline',W/2,50,32,'#f8fafc',ha,'center','700');
  
  // ── Top-left: Structural Track ──
  if(t>0.05){
    const sta=easeOut((t-0.05)*2.5);
    drawGlass(60,90,W*0.3,H*0.42,16,sta,'rgba(6,182,212,0.2)','rgba(10,25,50,0.5)');
    fadeText('Structural Track',60+W*0.15,120,20,'#67e8f9',sta,'center','700');
    
    // Fundus image (inside structural track)
    drawCircleFundus(200,280,90,fundusImg,sta);
    
    // Detection list
    const items=[{l:'Optic Disc',d:0.12},{l:'Fovea',d:0.16},{l:'Blood Vessels',d:0.2},{l:'Blood Vessels',d:0.24}];
    items.forEach((item,i)=>{
      const ia=easeOut((t-item.d)*3);
      const iy=200+i*42;
      X.save();X.globalAlpha=ia;X.strokeStyle='rgba(255,255,255,0.15)';X.lineWidth=1;X.setLineDash([3,3]);
      X.beginPath();X.moveTo(290,280-40+i*28);X.lineTo(350,iy);X.stroke();X.setLineDash([]);X.restore();
      fadeText(item.l,360,iy,15,'#94a3b8',ia,'left','500');
    });
    
    // DR Severity Prediction bar chart
    if(t>0.25){
      const cha=easeOut((t-0.25)*2);
      fadeText('DR Severity Prediction',250,380,14,'#94a3b8',cha);
      const bars=[
        {h:30,c:'#3b82f6'},{h:50,c:'#60a5fa'},{h:90,c:'#10b981'},
        {h:120,c:'#f97316'},{h:150,c:'#10b981'},{h:80,c:'#f97316'},
        {h:40,c:'#ef4444'}
      ];
      const bx=120,by=465,bw=28,bgap=8;
      bars.forEach((b,i)=>{
        const ba=easeOut((t-0.28-i*0.02)*3)*cha;
        const bh=b.h*ba;
        X.save();X.globalAlpha=cha;

    drawGlass(140,105,W*0.32,H*0.38,12,cha,'rgba(255,255,255,0.04)','rgba(10,20,40,0.7)');
    fadeText('GPU Throughput',280,130,16,'#e2e8f0',cha,'center','700');
    
    const cx=180,cy=355,cw=W*0.27,ch=180;
    // Grid
    X.save();X.globalAlpha=cha*0.2;X.strokeStyle='#334155';X.lineWidth=0.5;
    for(let g=0;g<5;g++){X.beginPath();X.moveTo(cx,cy-g*(ch/4));X.lineTo(cx+cw,cy-g*(ch/4));X.stroke();}
    X.restore();
    // Y-axis labels
    ['100','80','60','40','20','0'].forEach((v,i)=>fadeText(v,cx-20,cy-i*(ch/5),10,'#475569',cha*0.5,'right','400'));
    // X-axis labels
    ['0','200','1000','2000','3000'].forEach((v,i)=>fadeText(v,cx+i*(cw/4),cy+18,10,'#475569',cha*0.5,'center','400'));
    
    // Lines (3 series)
    const series=[
      {c:'#10b981',offset:0},{c:'#f97316',offset:15},{c:'#fbbf24',offset:8}
    ];
    series.forEach((s,si)=>{
      const pts=30;const drawn=Math.floor(easeOut((t-0.12-si*0.03)*2)*pts);
      if(drawn<2)return;
      X.save();X.globalAlpha=cha;X.strokeStyle=s.c;X.lineWidth=2;X.beginPath();
      for(let p=0;p<drawn;p++){
        const px2=cx+(p/(pts-1))*cw;
        const val=(20+s.offset+p*2+Math.sin(p*0.8+si)*8)/100;
        const py2=cy-val*ch;
        p===0?X.moveTo(px2,py2):X.lineTo(px2,py2);
      }
      X.stroke();X.restore();
    });
  }
  
  // ── Network Bandwidth Chart ──
  if(t>0.15){
    const nba=easeOut((t-0.15)*2.5);
    drawGlass(140,H*0.5+10,W*0.32,H*0.38,12,nba,'rgba(255,255,255,0.04)','rgba(10,20,40,0.7)');
    fadeText('Network Bandwidth',300,H*0.5+40,16,'#e2e8f0',nba,'center','700');
    
    const nx=180,ny=H*0.87,nw=W*0.27,nh=160;
    // Legend
    X.save();X.globalAlpha=nba;
    X.fillStyle='#10b981';X.fillRect(nx+nw*0.4,H*0.5+55,12,3);
    fadeText('Census',nx+nw*0.4+40,H*0.5+57,11,'#10b981',nba,'center','500');
    X.fillStyle='#f97316';X.fillRect(nx+nw*0.6,H*0.5+55,12,3);
    fadeText('Secum',nx+nw*0.6+38,H*0.5+57,11,'#f97316',nba,'center','500');
    X.restore();
    
    // Y-axis
    ['100','80','60','40','20','0'].forEach((v,i)=>fadeText(v,nx-20,ny-i*(nh/5),10,'#475569',nba*0.5,'right','400'));
    ['0','500','1000','2000','3000'].forEach((v,i)=>fadeText(v,nx+i*(nw/4),ny+18,10,'#475569',nba*0.5,'center','400'));
    
    // Area chart
    const pts2=30;const drawn2=Math.floor(easeOut((t-0.2)*2)*pts2);
    if(drawn2>1){
      X.save();X.globalAlpha=nba*0.3;
      X.fillStyle='rgba(59,130,246,0.3)';X.beginPath();X.moveTo(nx,ny);
      for(let p=0;p<drawn2;p++){
        const px2=nx+(p/(pts2-1))*nw;
        const val=(30+Math.sin(p*0.5)*15+p*1.5)/100;
        X.lineTo(px2,ny-val*nh);
      }
      X.lineTo(nx+((drawn2-1)/(pts2-1))*nw,ny);X.fill();X.restore();
      
      X.save();X.globalAlpha=nba;X.strokeStyle='#3b82f6';X.lineWidth=2;X.beginPath();
      for(let p=0;p<drawn2;p++){
        const px2=nx+(p/(pts2-1))*nw;
        const val=(30+Math.sin(p*0.5)*15+p*1.5)/100;
        p===0?X.moveTo(px2,ny-val*nh):X.lineTo(px2,ny-val*nh);
      }
      X.stroke();X.restore();
    }
  }
  
  // ── Simulink Model (vertical state machine) ──
  if(t>0.2){
    const sma=easeOut((t-0.2)*2.5);
    drawGlass(W*0.42,105,W*0.2,H*0.85,12,sma,'rgba(255,255,255,0.04)','rgba(10,20,40,0.6)');
    fadeText('Simulink Model',W*0.42+W*0.1,130,16,'#e2e8f0',sma,'center','700');
    
    // State machine nodes
    const states=[
      {l:'Simulink Model',c:'#a855f7',y:180},{l:'Capture',c:'#06b6d4',y:300},
      {l:'Focus',c:'#f97316',y:440},{l:'Run',c:'#ef4444',y:580},{l:'Discrete Model',c:'#3b82f6',y:720}
    ];
    const smx=W*0.42+W*0.1;
    states.forEach((s,i)=>{
      const sa=easeOut((t-0.22-i*0.04)*3)*sma;
      // Node circle
      X.save();X.globalAlpha=sa;
      X.fillStyle=s.c;X.shadowColor=s.c;X.shadowBlur=8;
      X.beginPath();X.arc(smx,s.y,16,0,7);X.fill();X.shadowBlur=0;
      X.restore();
      fadeText(s.l,smx,s.y+35,12,'#94a3b8',sa,'center','500');
      
      // Connecting lines
      if(i<states.length-1){
        X.save();X.globalAlpha=sa*0.4;X.strokeStyle='rgba(255,255,255,0.3)';X.lineWidth=2;
        X.beginPath();X.moveTo(smx,s.y+16);X.lineTo(smx,states[i+1].y-16);X.stroke();
        // Arrow
        X.fillStyle='rgba(255,255,255,0.3)';X.beginPath();
        X.moveTo(smx-5,states[i+1].y-20);X.lineTo(smx+5,states[i+1].y-20);
        X.lineTo(smx,states[i+1].y-14);X.fill();
        X.restore();
      }
    });
    
    // Play button (between Capture and Focus)
    if(t>0.35){
      const pba=easeOut((t-0.35)*3)*sma;
      X.save();X.globalAlpha=pba;
      drawGlass(smx-40,states[1].y+50,80,50,10,1,'rgba(255,255,255,0.1)','rgba(30,40,60,0.8)');
      X.fillStyle='#e2e8f0';X.beginPath();
      X.moveTo(smx-8,states[1].y+65);X.lineTo(smx-8,states[1].y+88);
      X.lineTo(smx+12,states[1].y+76);X.fill();
      X.restore();
    }
  }
  
  // ── Clinical Report (overlaid, right side) ──
  if(t>0.4){
    const rpa=easeOut((t-0.4)*2);
    const rx=W*0.58,ry=80,rw=W*0.38,rh=H*0.88;
    
    // Clipboard top
    X.save();X.globalAlpha=rpa;
    X.fillStyle='#475569';roundRect(rx+rw/2-40,ry-15,80,30,8);X.fill();
    X.fillStyle='#64748b';roundRect(rx+rw/2-25,ry-8,50,16,4);X.fill();
    X.restore();
    
    // Report body (white-ish)
    drawGlass(rx,ry,rw,rh,16,rpa,'rgba(255,255,255,0.1)','rgba(240,245,255,0.92)');
    
    // Shadow effect
    X.save();X.globalAlpha=rpa*0.15;
    X.fillStyle='#000';roundRect(rx+5,ry+5,rw,rh,16);X.fill();X.restore();
    
    // Report title
    fadeText('Clinical Report',rx+rw/2,ry+45,24,'#1e293b',rpa,'center','800');
    
    // Separator line
    X.save();X.globalAlpha=rpa*0.3;X.strokeStyle='#cbd5e1';X.lineWidth=1;
    X.beginPath();X.moveTo(rx+30,ry+65);X.lineTo(rx+rw-30,ry+65);X.stroke();X.restore();
    
    // Fundus thumbnail
    if(t>0.45){
      const fta=easeOut((t-0.45)*3)*rpa;
      const ftx=rx+50,fty=ry+90,fts=110;
      if(fundusImg.complete){
        X.save();X.globalAlpha=fta;
        roundRect(ftx,fty,fts,fts,8);X.clip();
        X.drawImage(fundusImg,ftx,fty,fts,fts);
        X.restore();
        X.save();X.globalAlpha=fta*0.5;X.strokeStyle='#94a3b8';X.lineWidth=1;
        roundRect(ftx,fty,fts,fts,8);X.stroke();X.restore();
      }
      
      // Report fields
      const fields=[
        {l:'Doctor Function',v:'102/0094 POO',y:ry+100},
        {l:'Accountability Grade',v:'',y:ry+130},
        {l:'Layem Dare',v:'1 02/14',y:ry+155},
        {l:'Dode',v:'Clinical Level',y:ry+185}
      ];
      fields.forEach((f,i)=>{
        const fa2=easeOut((t-0.48-i*0.02)*3)*fta;
        fadeText(f.l,rx+180,f.y,13,'#475569',fa2,'left','500');
        if(f.v){
          drawGlass(rx+rw*0.55,f.y-12,rw*0.35,24,4,fa2,'rgba(148,163,184,0.3)','rgba(255,255,255,0.5)');
          fadeText(f.v,rx+rw*0.55+rw*0.175,f.y,11,'#1e293b',fa2,'center','600');
        }
      });
    }
    
    // DR Severity Grade
    if(t>0.55){
      const dga=easeOut((t-0.55)*3)*rpa;
      fadeText('DR Severity Grade:',rx+50,ry+240,14,'#1e293b',dga,'left','600');
      drawGlass(rx+200,ry+228,40,24,4,dga,'rgba(148,163,184,0.3)','rgba(255,255,255,0.5)');
      fadeText('4',rx+220,ry+240,14,'#1e293b',dga,'center','700');
      
      fadeText('SHAP Reliable:',rx+280,ry+240,14,'#1e293b',dga,'left','600');
      // Checkboxes
      for(let i=0;i<4;i++){
        X.save();X.globalAlpha=dga;
        X.strokeStyle=i<2?'#10b981':'#cbd5e1';X.lineWidth=1.5;
        roundRect(rx+390+i*24,ry+230,18,18,3);X.stroke();
        if(i<2){X.fillStyle='#10b981';fadeText('✓',rx+399+i*24,ry+240,12,'#10b981',dga,'center','700');}
        X.restore();
      }
    }
    
    // Checkmark rows
    if(t>0.6){
      const cra=easeOut((t-0.6)*3)*rpa;
      const checkRows=['Severity Risse:','DR Enseen Rectors:'];
      checkRows.forEach((cr,i)=>{
        const cy2=ry+280+i*35;
        X.save();X.globalAlpha=cra;
        X.fillStyle='#10b981';X.beginPath();X.arc(rx+50,cy2,9,0,7);X.fill();
        fadeText('✓',rx+50,cy2,11,'#fff',cra,'center','700');
        X.restore();
        fadeText(cr,rx+70,cy2,13,'#1e293b',cra,'left','500');
        for(let j=0;j<5;j++){
          X.save();X.globalAlpha=cra;
          X.strokeStyle=j<2?'#10b981':'#cbd5e1';X.lineWidth=1.5;
          roundRect(rx+220+j*24,cy2-9,18,18,3);X.stroke();
          if(j<2)fadeText('✓',rx+229+j*24,cy2,11,'#10b981',cra,'center','700');
          X.restore();
        }
      });
    }
    
    // Recommendations
    if(t>0.65){
      const reca=easeOut((t-0.65)*3)*rpa;
      fadeText('Recommendations',rx+50,ry+370,15,'#1e293b',reca,'left','700');
      X.save();X.globalAlpha=reca*0.3;X.strokeStyle='#94a3b8';X.lineWidth=1;
      roundRect(rx+40,ry+385,rw-80,55,8);X.stroke();X.restore();
      fadeText('Procentline aculire to do presenolance finances and',rx+55,ry+405,11,'#475569',reca,'left','400');
      fadeText('pontitos and accemmet recommendation.',rx+55,ry+420,11,'#475569',reca,'left','400');
    }
    
    // Doctor signature
    if(t>0.7){
      const siga=easeOut((t-0.7)*3)*rpa;
      fadeText('Support Signature',rx+50,ry+470,13,'#1e293b',siga,'left','600');
      // Cursive signature
      X.save();X.globalAlpha=siga;X.strokeStyle='#1e3a5f';X.lineWidth=2;X.lineCap='round';
      X.beginPath();
      X.moveTo(rx+250,ry+480);
      X.quadraticCurveTo(rx+280,ry+460,rx+310,ry+475);
      X.quadraticCurveTo(rx+340,ry+490,rx+370,ry+465);
      X.quadraticCurveTo(rx+390,ry+450,rx+410,ry+470);
      X.stroke();X.restore();
      fadeText('Signature',rx+330,ry+500,11,'#64748b',siga,'center','400');
    }
    
    // Final Diagnosis button
    if(t>0.75){
      const btna=easeOut((t-0.75)*3)*rpa;
      const btnx=rx+40,btny=ry+rh-70,btnw=rw-80,btnh=45;
      X.save();X.globalAlpha=btna;
      const btnGrd=X.createLinearGradient(btnx,btny,btnx+btnw,btny);
      btnGrd.addColorStop(0,'#10b981');btnGrd.addColorStop(1,'#059669');
      X.fillStyle=btnGrd;roundRect(btnx,btny,btnw,btnh,10);X.fill();
      X.restore();
      fadeText('Final Diagnosis & Treatment Plan',rx+rw/2,btny+btnh/2,16,'#ffffff',btna,'center','700');
    }
    
    // Close button (X)
    if(t>0.5){
      const xa=rpa*0.6;
      fadeText('✕',rx+rw-25,ry+25,18,'#94a3b8',xa,'center','400');
    }
    
    // Confidence ring (behind report, partially visible)
    if(t>0.55){
      const cra=easeOut((t-0.55)*2)*rpa*0.4;
      X.save();X.globalAlpha=cra;
      X.strokeStyle='rgba(6,182,212,0.3)';X.lineWidth=10;
      X.beginPath();X.arc(rx+rw+30,ry+80,60,-Math.PI/2,-Math.PI/2+0.25*Math.PI*2);X.stroke();
      X.strokeStyle='rgba(255,255,255,0.05)';X.beginPath();X.arc(rx+rw+30,ry+80,60,0,Math.PI*2);X.stroke();
      X.restore();
      fadeText('25%',rx+rw+30,ry+80,18,'#06b6d4',cra,'center','800');
    }
  }
}

// ─── SCENE 5: CLOSING ───
function scene5_closing(t){
  // Ambient orbs
  for(let i=0;i<6;i++){
    const px=Math.sin(frame*0.004+i*1.2)*W*0.3+W/2;
    const py=Math.cos(frame*0.006+i*0.8)*H*0.2+H/2;
    drawGlow(px,py,300+Math.sin(frame*0.01+i)*50,'rgb(6,182,212)',0.08);
  }
  
  const ea=easeOut(Math.min(1,t*2));
  fadeText('RetinaAI Pro',W/2,H*0.32,64,'#f8fafc',ea,'center','700');
  fadeText('Saving Sight. Saving Lives.',W/2,H*0.32+55,28,'#06b6d4',ea,'center','500');
  
  if(t>0.15){
    const sa=easeOut((t-0.15)*2);
    fadeText('End-to-end AI-powered screening for rural India',W/2,H*0.52,20,'#94a3b8',sa,'center','400');
  }
  
  if(t>0.25){
    const ba=easeOut((t-0.25)*2);
    const stats=[{v:'94.8%',l:'Accuracy'},{v:'0.925',l:'Cohen κ'},{v:'148ms',l:'Inference'},{v:'100K+',l:'Patients/yr'}];
    stats.forEach((s,i)=>{
      const sx=W/2+(i-1.5)*200;const sy=H*0.65;
      drawGlass(sx-80,sy-30,160,75,14,ba);
      fadeText(s.v,sx,sy-2,28,'#06b6d4',ba,'center','800');
      fadeText(s.l,sx,sy+28,14,'#94a3b8',ba,'center','600');
    });
  }
  
  if(t>0.4){
    const la=easeOut((t-0.4)*2);
    fadeText('SIH 2026 · MathWorks Challenge',W/2,H*0.85,18,'#475569',la,'center','600');
  }
  
  // Expanding rings
  const rA=Math.max(0,1-(frame%120)/120);
  X.save();X.strokeStyle=`rgba(6,182,212,${rA*0.12})`;X.lineWidth=2;
  X.beginPath();X.arc(W/2,H*0.38,(frame%120)*5,0,Math.PI*2);X.stroke();X.restore();
}

// ─── ENGINE ───
const scenes=[scene0_doctor,scene1_acquisition,scene2_tracks,scene3_interpretability,scene4_simulink,scene5_closing];

// Transition system
const transitionCanvas=document.createElement('canvas');
transitionCanvas.width=W;transitionCanvas.height=H;
const tX=transitionCanvas.getContext('2d');
let isTransitioning=false,transitionTime=0;
const TRANSITION_DUR=30;

function render(){
  frame++;sceneFrame++;
  
  const currentDur=sceneDurations[Math.min(scene,sceneDurations.length-1)]||300;
  if(sceneFrame>=currentDur&&scene<scenes.length-1){
    tX.clearRect(0,0,W,H);tX.drawImage(C,0,0);
    scene++;sceneFrame=0;
    isTransitioning=true;transitionTime=0;
  }
  
  X.clearRect(0,0,W,H);
  drawBg();
  
  const dur=sceneDurations[Math.min(scene,sceneDurations.length-1)]||300;
  const t=sceneFrame/dur;
  
  try{if(scenes[scene])scenes[scene](t);}catch(e){console.error('Scene error:',e);}
  
  // Transition overlay
  if(isTransitioning){
    transitionTime++;
    const p=transitionTime/TRANSITION_DUR;
    const e2=easeOut(p);
    X.save();X.globalAlpha=1-e2;X.drawImage(transitionCanvas,0,0);X.restore();
    if(transitionTime>=TRANSITION_DUR)isTransitioning=false;
  }
  
  // Progress bar
  let totalElapsed=0;
  for(let s=0;s<scene;s++)totalElapsed+=sceneDurations[s];
  totalElapsed+=sceneFrame;
  const prog=totalElapsed/totalFrames;
  X.fillStyle='rgba(6,182,212,0.8)';
  X.fillRect(0,H-4,W*prog,4);
  
  // Status
  document.getElementById('status').textContent=`Recording... Scene ${scene+1}/${scenes.length} | Frame ${totalElapsed}/${totalFrames} | ${Math.floor(prog*100)}%`;
  
  if(scene>=scenes.length-1&&sceneFrame>=sceneDurations[scenes.length-1]){
    stopRecording();
    return;
  }
  
  requestAnimationFrame(render);
}

function startGeneration(){
  document.getElementById('status').textContent='Starting recording...';
  
  // Start MediaRecorder
  const stream=C.captureStream(60);
  recorder=new MediaRecorder(stream,{mimeType:'video/webm;codecs=vp9',videoBitsPerSecond:8000000});
  chunks=[];
  recorder.ondataavailable=e=>{if(e.data.size>0)chunks.push(e.data);};
  recorder.onstop=()=>{
    const blob=new Blob(chunks,{type:'video/webm'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;a.download='retina_ai_demo.webm';
    document.body.appendChild(a);a.click();
    document.getElementById('status').textContent='✅ Recording complete! WebM downloaded. Converting to MP4...';
  };
  recorder.start();
  recording=true;
  
  requestAnimationFrame(render);
}

function stopRecording(){
  if(recorder&&recorder.state==='recording'){
    recorder.stop();
  }
  document.getElementById('status').textContent='✅ Done! Video saved.';
}

// Fallback if images don't load
setTimeout(()=>{if(loadedCount<totalImages)startGeneration();},5000);
</script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>RetinaAI Pro — Cinematic Workflow</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
  background:#000000;
  overflow:hidden;
  font-family:'Inter',sans-serif;
  color:#f0f0f0;
}
canvas{display:block;}
#progress{position:fixed;bottom:0;left:0;height:4px;background:linear-gradient(90deg,#d97706,#f59e0b,#fbbf24,#ffffff);transition:width 0.3s;z-index:10;border-radius:0 2px 2px 0;}
#skip{position:fixed;bottom:24px;right:24px;background:rgba(15,23,42,0.85);border:1px solid rgba(255,255,255,0.1);color:#f8fafc;padding:10px 22px;border-radius:30px;cursor:pointer;font-size:13px;font-weight:600;z-index:10;backdrop-filter:blur(12px);font-family:'Inter';transition:all 0.3s;box-shadow:0 8px 24px rgba(0,0,0,0.4);}
#skip:hover{background:rgba(6,182,212,0.15);border-color:rgba(6,182,212,0.5);transform:translateY(-2px);}
#scene-label{position:fixed;top:24px;left:24px;font-size:12px;font-weight:600;color:rgba(148,163,184,0.6);letter-spacing:2px;text-transform:uppercase;z-index:10;font-family:'JetBrains Mono';}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="progress" style="width:0%"></div>
<div id="scene-label"></div>
<button id="skip" onclick="nextScene()">Skip ▶</button>
<script>
const C=document.getElementById('c'),X=C.getContext('2d');
let W,H,frame=0,scene=0,sceneFrame=0;
const transitionCanvas=document.createElement('canvas');
const tX=transitionCanvas.getContext('2d');
let isTransitioning=false,transitionTime=0,transitionType=0;
const TRANSITION_DUR=60;
function resize(){W=C.width=transitionCanvas.width=window.innerWidth;H=C.height=transitionCanvas.height=window.innerHeight;}
resize();window.onresize=resize;

// Images
const doctorImg=new Image();doctorImg.src='doctor_fundoscopy.png';
const fundusImg=new Image();fundusImg.src='fundus_moderate.jpg';
const fundusNorm=new Image();fundusNorm.src='fundus_normal.jpg';
const fundusSev=new Image();fundusSev.src='fundus_severe.jpg';

// Scene config
const sceneNames=['','ACQUISITION','QUALITY GATE','PREPROCESSING','STRUCTURAL TRACK','HYBRID DL TRACK','FEATURE FUSION','EXPLAINABILITY','CALIBRATION','CLINICAL REPORT','SIMULINK OPTIMIZATION',''];
const sceneDurations=[900,900,900,900,1000,1000,900,1000,900,1000,1000,600];
const totalFrames=sceneDurations.reduce((a,b)=>a+b,0);

// ─── UTILITIES ───
function ease(t){return t<0.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;} // easeInOutCubic
function easeOut(t){return 1-Math.pow(1-Math.max(0,Math.min(1,t)),3);}
function lerp(a,b,t){return a+(b-a)*Math.max(0,Math.min(1,t));}

function fadeText(text,x,y,size,color,alpha,align='center',weight='600',font='Inter'){
  if(alpha<=0)return;
  X.save();X.globalAlpha=Math.max(0,Math.min(1,alpha));
  X.font=`${weight} ${size}px '${font}',sans-serif`;
  X.fillStyle=color;X.textAlign=align;X.textBaseline='middle';
  X.fillText(text,x,y);X.restore();
}

function drawGlow(x,y,r,color,alpha=0.3){
  const g=X.createRadialGradient(x,y,0,x,y,r);
  g.addColorStop(0,color.replace(')',`,${alpha})`).replace('rgb','rgba'));
  g.addColorStop(1,'rgba(0,0,0,0)');
  X.fillStyle=g;X.fillRect(x-r,y-r,r*2,r*2);
}

function roundRect(x,y,w,h,r){
  X.beginPath();X.moveTo(x+r,y);X.lineTo(x+w-r,y);X.quadraticCurveTo(x+w,y,x+w,y+r);
  X.lineTo(x+w,y+h-r);X.quadraticCurveTo(x+w,y+h,x+w-r,y+h);X.lineTo(x+r,y+h);
  X.quadraticCurveTo(x,y+h,x,y+h-r);X.lineTo(x,y+r);X.quadraticCurveTo(x,y,x+r,y);X.closePath();
}

function drawGlass(x,y,w,h,r=16,alpha=1,bc='rgba(255,255,255,0.08)',bg='rgba(15,23,42,0.6)'){
  X.save();X.globalAlpha=Math.max(0,alpha);
  X.fillStyle=bg;X.shadowColor='rgba(0,0,0,0.3)';X.shadowBlur=20;X.shadowOffsetY=8;
  roundRect(x,y,w,h,r);X.fill();X.shadowColor='transparent';
  X.strokeStyle=bc;X.lineWidth=1;roundRect(x,y,w,h,r);X.stroke();X.restore();
}

function drawBar(x,y,w,h,fill,color,bg='rgba(255,255,255,0.06)'){
  X.fillStyle=bg;roundRect(x,y,w,h,h/2);X.fill();
  if(fill>0){
    const grd=X.createLinearGradient(x,y,x+w*fill,y);
    grd.addColorStop(0,color);grd.addColorStop(1,color.replace('1)','0.6)'));
    X.fillStyle=grd;roundRect(x,y,w*fill,h,h/2);X.fill();
    X.shadowColor=color;X.shadowBlur=8;X.fill();X.shadowBlur=0;
  }
}

function drawCircleFundus(x,y,r,img,alpha=1){
  if(alpha<=0)return;
  X.save();X.globalAlpha=Math.max(0,alpha);
  X.beginPath();X.arc(x,y,r,0,Math.PI*2);X.clip();
  try{if(img.complete&&img.naturalWidth>0)X.drawImage(img,x-r,y-r,r*2,r*2);}catch(e){}
  X.restore();
  X.save();X.globalAlpha=Math.max(0,alpha);
  X.strokeStyle='rgba(255,255,255,0.12)';X.lineWidth=2;
  X.beginPath();X.arc(x,y,r,0,Math.PI*2);X.stroke();X.restore();
}

function drawFlowArrow(x1,y1,x2,y2,alpha,color='#06b6d4'){
  if(alpha<=0)return;
  X.save();X.globalAlpha=alpha;
  X.strokeStyle=color;X.lineWidth=2;X.setLineDash([8,6]);X.lineDashOffset=-frame*2;
  X.beginPath();X.moveTo(x1,y1);X.lineTo(x2,y2);X.stroke();X.setLineDash([]);
  // Arrowhead
  const a=Math.atan2(y2-y1,x2-x1);
  X.fillStyle=color;X.beginPath();
  X.moveTo(x2,y2);X.lineTo(x2-12*Math.cos(a-0.4),y2-12*Math.sin(a-0.4));
  X.lineTo(x2-12*Math.cos(a+0.4),y2-12*Math.sin(a+0.4));X.fill();
  // Traveling dot
  const prog=(frame*0.02)%1;
  const dx=lerp(x1,x2,prog),dy=lerp(y1,y2,prog);
  X.fillStyle=color;X.shadowColor=color;X.shadowBlur=8;
  X.beginPath();X.arc(dx,dy,3,0,7);X.fill();X.shadowBlur=0;
  X.restore();
}

function drawPulseRing(x,y,r,color,alpha=0.3){
  const p=(frame%90)/90;
  X.save();X.globalAlpha=alpha*(1-p);
  X.strokeStyle=color;X.lineWidth=2;
  X.beginPath();X.arc(x,y,r+p*40,0,Math.PI*2);X.stroke();X.restore();
}

function drawBg(){
  // Warm eye-themed ambient glows
  drawGlow(W*0.2,H*0.3,400,'rgb(217,119,6)',0.03);
  drawGlow(W*0.8,H*0.7,350,'rgb(245,158,11)',0.025);
  drawGlow(W*0.5,H*0.5,300,'rgb(251,191,36)',0.015);
}

// ─── SCENE 0: DOCTOR FUNDOSCOPY → ZOOM TRANSITION ───
function scene0_doctor(t){
  // Phase 1 (0–0.55): Doctor image cinematic reveal with annotations
  // Phase 2 (0.55–0.85): Zoom into the slit-lamp instrument area
  // Phase 3 (0.85–1.0): Camera flash → white out → seamless handoff

  const zoomStart=0.55, zoomEnd=0.85, flashStart=0.85;
  
  if(doctorImg.complete&&doctorImg.naturalWidth>0){
    const imgAspect=doctorImg.naturalWidth/doctorImg.naturalHeight;
    let baseW,baseH;
    if(W/H>imgAspect){baseH=H*0.75;baseW=baseH*imgAspect;}
    else{baseW=W*0.5;baseH=baseW/imgAspect;}
    
    // Calculate zoom transform — zoom UP toward the eye/instrument area (top third)
    let scale=1, offsetX=0, offsetY=0, imgAlpha=1;
    if(t>zoomStart&&t<=zoomEnd){
      const zp=easeOut((t-zoomStart)/(zoomEnd-zoomStart));
      scale=1+zp*3;  // Zoom to 4x
      // Zoom UP into the eye/slit-lamp area (top-center of image)
      offsetX=0;
      offsetY=baseH*0.28*zp;  // Positive = shift image DOWN = viewport goes UP
    } else if(t>zoomEnd){
      scale=4;
      offsetY=baseH*0.28;
      imgAlpha=Math.max(0,1-(t-flashStart)*8);
    }
    
    const revealT=easeOut(Math.min(1,t*2));
    const imgX=W/2-baseW/2+offsetX;
    const imgY=H/2-baseH/2+25+offsetY;
    
    // Ambient glow
    drawGlow(W/2,H/2,Math.max(baseW,baseH)*0.8,'rgb(6,182,212)',0.08*revealT);
    
    // Draw image with zoom
    X.save();
    X.globalAlpha=Math.min(revealT,imgAlpha);
    X.translate(W/2,H/2);
    X.scale(scale,scale);
    X.translate(-W/2,-H/2);
    roundRect(imgX,imgY,baseW,baseH,24/scale);X.clip();
    X.drawImage(doctorImg,imgX,imgY,baseW,baseH);
    X.restore();
    
    // Border (only before zoom)
    if(t<zoomStart+0.1){
      X.save();X.globalAlpha=revealT*0.5*(1-easeOut((t-zoomStart)*5));
      X.strokeStyle='rgba(6,182,212,0.3)';X.lineWidth=2;
      roundRect(imgX,imgY,baseW,baseH,24);X.stroke();X.restore();
    }
    
    // Slit-lamp pulse rings (instrument center)
    if(t>0.15&&t<zoomEnd){
      const slitX=W/2, slitY=H/2-baseH*0.05;
      const pa=easeOut((t-0.15)*3)*(1-easeOut((t-zoomStart)*3));
      drawPulseRing(slitX,slitY,25,'#06b6d4',0.2*pa);
      drawPulseRing(slitX,slitY,45,'#3b82f6',0.12*pa);
      drawPulseRing(slitX,slitY,65,'#8b5cf6',0.06*pa);
      
      // Annotation lines
      if(t>0.25){
        const aa=easeOut((t-0.25)*3)*pa;
        X.save();X.globalAlpha=aa;X.strokeStyle='rgba(6,182,212,0.5)';X.lineWidth=1;X.setLineDash([4,4]);
        X.beginPath();X.moveTo(slitX+10,slitY-20);X.lineTo(slitX+120,slitY-60);X.stroke();X.setLineDash([]);
        X.restore();
        drawGlass(slitX+120,slitY-85,180,45,10,aa,'rgba(6,182,212,0.3)','rgba(6,182,212,0.06)');
        fadeText('Slit-lamp Biomicroscope',slitX+210,slitY-62,12,'#67e8f9',aa,'center','600');
      }
    }
    
    // "Capturing…" indicator during zoom
    if(t>zoomStart&&t<flashStart){
      const ci=easeOut((t-zoomStart)*3);
      const blink=Math.sin(frame*0.2)>0?1:0.4;
      X.save();X.globalAlpha=ci*blink;
      X.fillStyle='#ef4444';X.beginPath();X.arc(W-80,60,6,0,7);X.fill();
      X.restore();
      fadeText('● REC',W-55,60,14,'#ef4444',ci*blink,'left','700','JetBrains Mono');
      fadeText('Capturing retinal image…',W/2,H-50,16,'#67e8f9',ci,'center','600');
    }
  }
  
  // Title text (fades out during zoom)
  const titleFade=t<zoomStart?1:Math.max(0,1-(t-zoomStart)*5);
  const ta=easeOut(Math.min(1,(t-0.03)*2.5))*titleFade;
  fadeText('Fundoscopy Examination',W/2,55,Math.min(36,W*0.028),'#f8fafc',ta,'center','700','Space Grotesk');
  fadeText('The ophthalmologist examines the patient\'s retina through a slit-lamp biomicroscope',W/2,88,Math.min(15,W*0.011),'#94a3b8',ta*0.8,'center','400');
  
  // Bottom pipeline preview (before zoom)
  if(t>0.35&&t<zoomStart){
    const ba=easeOut((t-0.35)*3);
    const steps=['Capture','Quality','CLAHE','Segment','Classify','Explain','Report'];
    const colors=['#3b82f6','#10b981','#8b5cf6','#06b6d4','#f97316','#ec4899','#3b82f6'];
    const totalW=steps.length*90+(steps.length-1)*20;
    const startX=W/2-totalW/2;
    steps.forEach((s,i)=>{
      const sa=easeOut((t-0.35-i*0.02)*4)*ba;
      const sx=startX+i*110+45;
      drawGlass(sx-40,H-80,80,36,18,sa,`${colors[i]}44`,`${colors[i]}0D`);
      fadeText(s,sx,H-62,11,colors[i],sa,'center','600');
      if(i<steps.length-1){
        X.save();X.globalAlpha=sa*0.4;X.strokeStyle='rgba(255,255,255,0.3)';X.lineWidth=1;
        X.beginPath();X.moveTo(sx+42,H-62);X.lineTo(sx+68,H-62);X.stroke();X.restore();
      }
    });
  }
  
  // Camera flash → white transition
  if(t>flashStart){
    const fp=(t-flashStart)/(1-flashStart);
    X.fillStyle=`rgba(255,255,255,${easeOut(fp)})`;
    X.fillRect(0,0,W,H);
  }
}

// ─── SCENE 1: IMAGE ACQUISITION (continues from flash) ───
function scene1_capture(t){
  // White flash fade-out (seamless from scene 0)
  if(t<0.1){
    X.fillStyle=`rgba(255,255,255,${1-easeOut(t*10)})`;
    X.fillRect(0,0,W,H);
  }
  
  const ha=easeOut(Math.min(1,t*3));

  fadeText('ACQUISITION FLOW',W/2,55,22,'#06b6d4',ha,'center','700','Space Grotesk');
  fadeText('Input stream → Quality gate → Standardization',W/2,85,14,'#64748b',ha*0.7,'center','400');
  
  // Doctor thumbnail (residual context from previous scene)
  if(doctorImg.complete&&doctorImg.naturalWidth>0){
    const thumbA=easeOut(Math.min(1,t*4))*0.6;
    const thumbS=55;
    X.save();X.globalAlpha=thumbA;
    X.beginPath();X.arc(55,H*0.5,thumbS,0,7);X.clip();
    X.drawImage(doctorImg,55-thumbS,H*0.5-thumbS,thumbS*2,thumbS*2);
    X.restore();
    X.save();X.globalAlpha=thumbA;X.strokeStyle='rgba(6,182,212,0.4)';X.lineWidth=2;
    X.beginPath();X.arc(55,H*0.5,thumbS,0,7);X.stroke();X.restore();
    fadeText('Doctor',55,H*0.5+thumbS+15,10,'#64748b',thumbA,'center','500');
  }
  
  // Animated flow arrow from doctor to fundus
  if(t>0.05){
    drawFlowArrow(115,H*0.5,W*0.2-10,H*0.5,easeOut((t-0.05)*4)*0.5,'#3b82f6');
  }
  
  // Raw fundus image (appears like it was just captured)
  const fx=W*0.28, fy=H*0.5, fr=Math.min(95,H*0.15);
  if(t>0.08){
    const fa=easeOut((t-0.08)*3);
    drawCircleFundus(fx,fy,fr*fa,fundusImg,fa);
    // "Just captured" flash ring
    if(t>0.08&&t<0.2){
      const flashR=easeOut((t-0.08)*8);
      X.save();X.globalAlpha=(1-flashR)*0.5;X.strokeStyle='#fff';X.lineWidth=3;
      X.beginPath();X.arc(fx,fy,fr+flashR*30,0,7);X.stroke();X.restore();
    }
    fadeText('Raw Fundus',fx,fy+fr+20,12,'#e2e8f0',fa,'center','600');
    fadeText('Captured Image',fx,fy+fr+36,11,'#64748b',fa,'center','400');
  }
  
  // Arrow to quality gate
  if(t>0.3){
    drawFlowArrow(fx+fr+15,fy,W*0.48,fy,easeOut((t-0.3)*3)*0.6,'#10b981');
  }
  
  // Quality assessment mini-panel
  if(t>0.35){
    const qa=easeOut((t-0.35)*2.5);
    const qx=W*0.48, qy=H*0.3;
    drawGlass(qx,qy,W*0.22,H*0.4,16,qa,'rgba(16,185,129,0.3)','rgba(16,185,129,0.05)');
    fadeText('Quality Gate',qx+W*0.11,qy+25,16,'#10b981',qa,'center','700');
    
    const checks=[
      {l:'Focus',v:'91.4%',d:0.4},{l:'Illumination',v:'88.2%',d:0.45},{l:'FoV',v:'96.5%',d:0.5}
    ];
    checks.forEach((c,i)=>{
      const ca=easeOut((t-c.d)*3);
      const cy2=qy+55+i*40;
      fadeText('✓',qx+20,cy2,14,'#10b981',ca,'left','700');
      fadeText(c.l,qx+40,cy2,13,'#e2e8f0',ca,'left','500');
      fadeText(c.v,qx+W*0.22-18,cy2,13,'#10b981',ca,'right','700','JetBrains Mono');
    });
    
    // Pass badge
    if(t>0.6){
      const pa=easeOut((t-0.6)*3);
      drawGlass(qx+W*0.03,qy+H*0.4-50,W*0.16,35,18,pa,'rgba(16,185,129,0.5)','rgba(16,185,129,0.1)');
      fadeText('PASS ✓',qx+W*0.11,qy+H*0.4-32,13,'#10b981',pa,'center','800');
    }
  }
  
  // Arrow to next pipeline step
  if(t>0.7){
    const na=easeOut((t-0.7)*3);
    drawFlowArrow(W*0.71,H*0.5,W*0.92,H*0.5,na*0.6,'#3b82f6');
    drawGlass(W*0.82,H*0.38,W*0.14,H*0.24,16,na,'rgba(59,130,246,0.3)','rgba(59,130,246,0.06)');
    fadeText('→ Preprocess',W*0.82+W*0.07,H*0.47,14,'#60a5fa',na,'center','700');
    fadeText('CLAHE, Denoise',W*0.82+W*0.07,H*0.47+20,11,'#475569',na,'center','400');
    fadeText('Normalize',W*0.82+W*0.07,H*0.47+35,11,'#475569',na,'center','400');
  }
}

// ─── SCENE 2: QUALITY ASSESSMENT ───
function scene2_quality(t){
  const ha=easeOut(Math.min(1,t*3));

  fadeText('IMAGE QUALITY ASSESSMENT',W/2,55,22,'#10b981',ha,'center','700','Space Grotesk');
  fadeText('Triage gate ensures diagnostic reliability',W/2,85,14,'#64748b',ha*0.7,'center','400');
  
  const fx=W*0.22, fy=H*0.52, fr=Math.min(110,H*0.17);
  drawCircleFundus(fx,fy,fr,fundusImg,ha);
  
  // Scanning line
  if(t<0.55){
    const scanY=fy-fr+(t/0.55)*fr*2;
    X.save();X.globalAlpha=0.8;X.strokeStyle='#10b981';X.lineWidth=3;
    X.beginPath();X.moveTo(fx-fr,scanY);X.lineTo(fx+fr,scanY);X.stroke();
    // Sweep glow behind scan line
    const sGrd=X.createLinearGradient(fx,scanY-50,fx,scanY);
    sGrd.addColorStop(0,'rgba(16,185,129,0)');sGrd.addColorStop(1,'rgba(16,185,129,0.25)');
    X.fillStyle=sGrd;X.beginPath();X.arc(fx,fy,fr,0,Math.PI*2);X.clip();
    X.fillRect(fx-fr,scanY-50,fr*2,50);
    X.restore();
  }
  
  // Metrics panel
  const mx=W*0.42, my=H*0.25;
  const metrics=[
    {l:'Focus (Sharpness)',v:91.4,c:'#10b981',icon:'◎',d:0.15},
    {l:'Illumination',v:88.2,c:'#3b82f6',icon:'☀',d:0.25},
    {l:'Field of View',v:96.5,c:'#06b6d4',icon:'◉',d:0.35}
  ];
  metrics.forEach((m,i)=>{
    const y=my+i*85;
    const a=easeOut((t-m.d)*3);
    const fillP=easeOut((t-m.d-0.08)*2);
    drawGlass(mx,y-28,W*0.42,62,14,a);
    fadeText(m.icon,mx+25,y+3,18,m.c,a,'center','400');
    fadeText(m.l,mx+50,y+3,15,'#e2e8f0',a,'left','600');
    drawBar(mx+W*0.2,y-6,W*0.14,14,fillP*(m.v/100),m.c);
    fadeText(`${(fillP*m.v).toFixed(1)}%`,mx+W*0.2+W*0.14+14,y+3,14,m.c,a,'left','800','JetBrains Mono');
  });
  
  // Pass/Fail decision
  if(t>0.65){
    const pa=easeOut((t-0.65)*3);
    const pulse=1+Math.sin(frame*0.12)*0.03;
    X.save();X.translate(W*0.63,H*0.73);X.scale(pulse,pulse);X.translate(-W*0.63,-H*0.73);
    drawGlass(W*0.42,H*0.68,W*0.42,55,14,pa,'rgba(16,185,129,0.5)','rgba(16,185,129,0.08)');
    fadeText('✓  PASS — Quality Adequate for Diagnosis',W*0.63,H*0.705,16,'#10b981',pa,'center','700');
    X.restore();
    drawPulseRing(W*0.47,H*0.705,15,'#10b981',pa*0.3);
  }
  
  // Fail path hint
  if(t>0.75){
    const fa=easeOut((t-0.75)*3);
    drawGlass(W*0.42,H*0.78,W*0.2,40,10,fa*0.5,'rgba(239,68,68,0.3)','rgba(239,68,68,0.05)');
    fadeText('✕  Fail → Recapture',W*0.52,H*0.80,12,'#ef4444',fa*0.5,'center','600');
  }
}

// ─── SCENE 3: PREPROCESSING & STANDARDIZATION ───
function scene3_preprocess(t){
  const ha=easeOut(Math.min(1,t*3));

  fadeText('PREPROCESSING & STANDARDIZATION',W/2,55,22,'#3b82f6',ha,'center','700','Space Grotesk');
  
  const fr=Math.min(95,H*0.15);
  const ox=W*0.12, oy=H*0.52;
  drawCircleFundus(ox,oy,fr,fundusImg,ha);
  fadeText('Raw Input',ox,oy+fr+22,12,'#64748b',ha,'center','500');
  
  // Pipeline steps
  const steps=[
    {n:'CLAHE',sub:'Contrast Enhancement',c:'#3b82f6'},
    {n:'Denoise',sub:'Bilateral Filter',c:'#8b5cf6'},
    {n:'Normalize',sub:'Illumination Correction',c:'#ec4899'},
    {n:'Resize',sub:'512×512 Standard',c:'#06b6d4'}
  ];
  const stepW=Math.min(120,W*0.09);
  steps.forEach((s,i)=>{
    const st=0.12+i*0.12;
    const a=easeOut((t-st)*3);
    const sx=W*0.28+i*(stepW+W*0.04);
    
    drawGlass(sx-stepW/2,oy-45,stepW,90,14,a,`${s.c}55`,`${s.c}0D`);
    fadeText(s.n,sx,oy-10,14,s.c,a,'center','700');
    fadeText(s.sub,sx,oy+12,10,'#94a3b8',a*0.7,'center','400');
    
    // Connection arrow with traveling dot
    if(i<steps.length-1){
      const nx=W*0.28+(i+1)*(stepW+W*0.04);
      X.save();X.globalAlpha=a;
      X.strokeStyle='rgba(255,255,255,0.12)';X.lineWidth=2;
      X.beginPath();X.moveTo(sx+stepW/2+4,oy);X.lineTo(nx-stepW/2-4,oy);X.stroke();
      // Traveling dot
      const dt=((frame*0.03-i*0.6)%1+1)%1;
      X.fillStyle=s.c;X.shadowColor=s.c;X.shadowBlur=6;
      X.beginPath();X.arc(sx+stepW/2+4+(nx-sx-stepW-8)*dt,oy,3,0,7);X.fill();X.shadowBlur=0;
      X.restore();
    }
  });
  
  // Input arrow
  drawFlowArrow(ox+fr+10,oy,W*0.28-stepW/2-15,oy,ha*0.6,'#3b82f6');
  
  // Enhanced output
  if(t>0.6){
    const ea=easeOut((t-0.6)*2.5);
    const ex=W*0.88, ey=oy;
    X.save();X.globalAlpha=ea;X.beginPath();X.arc(ex,ey,fr,0,Math.PI*2);X.clip();
    try{
      if(fundusImg.complete&&fundusImg.naturalWidth>0){
        X.drawImage(fundusImg,ex-fr,ey-fr,fr*2,fr*2);
        X.globalCompositeOperation='overlay';X.fillStyle='rgba(255,255,255,0.15)';X.fillRect(ex-fr,ey-fr,fr*2,fr*2);
      }
    }catch(e){}
    X.restore();
    X.save();X.globalAlpha=ea;X.strokeStyle='#10b981';X.lineWidth=3;X.shadowColor='#10b981';X.shadowBlur=12;
    X.beginPath();X.arc(ex,ey,fr,0,Math.PI*2);X.stroke();X.shadowBlur=0;X.restore();
    fadeText('Standardized',ex,ey+fr+20,13,'#10b981',ea,'center','700');
    
    const lastSx=W*0.28+(steps.length-1)*(stepW+W*0.04);
    drawFlowArrow(lastSx+stepW/2+10,oy,ex-fr-15,ey,ea*0.6,'#10b981');
  }
}

      {n:'Hard Exudates',v:'8 found',c:'#fbbf24',d:0.45},

// ─── SCENE 5: HYBRID DL TRACK ───
function scene5_deeplearning(t){
  const ha=easeOut(Math.min(1,t*3));

  fadeText('DEEP REPRESENTATION LEARNING',W/2,55,22,'#818cf8',ha,'center','700','Space Grotesk');
  fadeText('Hybrid DL Track — EfficientNetB4 + ResNet-50',W/2,85,14,'#64748b',ha*0.7,'center','400');
  
  // Input fundus
  const ix=W*0.06, iy=H*0.5, ir=35;
  drawCircleFundus(ix+ir,iy,ir,fundusImg,ha);
  
  const nnStartX=W*0.16, nnEndX=W*0.72;
  const branchY1=H*0.33, branchY2=H*0.67;
  
  // EfficientNetB4 branch (top)
  if(t>0.08){
    const ba=easeOut((t-0.08)*2.5);
    const layers=[4,6,10,14,10,6];
    layers.forEach((n,li)=>{
      const lx=nnStartX+li*(nnEndX-nnStartX)*0.14;
      const la=easeOut((t-0.08-li*0.04)*3);
      for(let ni=0;ni<Math.min(n,8);ni++){
        const ny=branchY1-((Math.min(n,8)-1)*13)/2+ni*13;
        X.save();X.globalAlpha=la;
        X.fillStyle=`hsl(${210+li*6},85%,${62-ni*3}%)`;
        X.shadowColor=X.fillStyle;X.shadowBlur=6;
        X.beginPath();X.arc(lx,ny,4,0,7);X.fill();X.shadowBlur=0;
        if(li<layers.length-1){
          X.strokeStyle=`rgba(59,130,246,${0.2*la})`;X.lineWidth=0.8;
          const nlx=nnStartX+(li+1)*(nnEndX-nnStartX)*0.14;
          const nn2=Math.min(layers[li+1],8);
          for(let nni=0;nni<nn2;nni++){
            const targetY=branchY1-((nn2-1)*13)/2+nni*13;
            X.beginPath();X.moveTo(lx+4,ny);X.lineTo(nlx-4,targetY);X.stroke();
            // Data flow dots
            const flow=((frame*0.025+li*0.35+ni*0.12+nni*0.08)%1+1)%1;
            if(flow<0.25&&la>0.5){
              const p=flow/0.25;
              X.fillStyle='#60a5fa';X.shadowColor='#60a5fa';X.shadowBlur=4;
              X.beginPath();X.arc(lx+4+(nlx-lx-8)*p,ny+(targetY-ny)*p,1.5,0,7);X.fill();X.shadowBlur=0;
            }
          }
        }
        X.restore();
      }
    });
    fadeText('EfficientNetB4',nnStartX+(nnEndX-nnStartX)*0.42,branchY1-75,14,'#60a5fa',ba,'center','700');
    fadeText('Local Patterns · 1792-d',nnStartX+(nnEndX-nnStartX)*0.42,branchY1-57,11,'#475569',ba,'center','400');
  }
  
  // ResNet-50 branch (bottom)
  if(t>0.14){
    const ba=easeOut((t-0.14)*2.5);
    const layers=[4,5,8,12,8,5];
    layers.forEach((n,li)=>{
      const lx=nnStartX+li*(nnEndX-nnStartX)*0.14;
      const la=easeOut((t-0.14-li*0.04)*3);
      for(let ni=0;ni<Math.min(n,8);ni++){
        const ny=branchY2-((Math.min(n,8)-1)*13)/2+ni*13;
        X.save();X.globalAlpha=la;
        X.fillStyle=`hsl(${270+li*8},75%,${62-ni*3}%)`;
        X.shadowColor=X.fillStyle;X.shadowBlur=6;
        X.beginPath();X.arc(lx,ny,4,0,7);X.fill();X.shadowBlur=0;
        if(li<layers.length-1){
          X.strokeStyle=`rgba(139,92,246,${0.2*la})`;X.lineWidth=0.8;
          const nlx=nnStartX+(li+1)*(nnEndX-nnStartX)*0.14;
          const nn2=Math.min(layers[li+1],8);
          for(let nni=0;nni<nn2;nni++){
            const targetY=branchY2-((nn2-1)*13)/2+nni*13;
            X.beginPath();X.moveTo(lx+4,ny);X.lineTo(nlx-4,targetY);X.stroke();
            const flow=((frame*0.025+li*0.35+ni*0.12+nni*0.08)%1+1)%1;
            if(flow<0.25&&la>0.5){
              const p=flow/0.25;
              X.fillStyle='#a78bfa';X.shadowColor='#a78bfa';X.shadowBlur=4;
              X.beginPath();X.arc(lx+4+(nlx-lx-8)*p,ny+(targetY-ny)*p,1.5,0,7);X.fill();X.shadowBlur=0;
            }
          }
        }
        X.restore();
      }
    });
    fadeText('ResNet-50',nnStartX+(nnEndX-nnStartX)*0.42,branchY2-75,14,'#a78bfa',ba,'center','700');
    fadeText('Global Context · 2048-d',nnStartX+(nnEndX-nnStartX)*0.42,branchY2-57,11,'#475569',ba,'center','400');
  }
  
  // Fusion node
  if(t>0.5){
    const fa=easeOut((t-0.5)*3);
    const fuseX=W*0.78, fuseY=H*0.5;
    drawGlass(fuseX-55,fuseY-30,110,60,14,fa,'rgba(236,72,153,0.5)','rgba(236,72,153,0.1)');
    fadeText('FUSION',fuseX,fuseY,14,'#f472b6',fa,'center','800');
    drawFlowArrow(nnEndX+10,branchY1,fuseX-55,fuseY-10,fa*0.6,'#60a5fa');
    drawFlowArrow(nnEndX+10,branchY2,fuseX-55,fuseY+10,fa*0.6,'#a78bfa');
  }
  
  // Output classes
  if(t>0.65){
    const oa=easeOut((t-0.65)*2.5);
    const outX=W*0.92;
    const classes=['Normal','Mild','Moderate','Severe','PDR'];
    const probs=[5,4,87,3,1];
    const cols=['#10b981','#3b82f6','#f97316','#ef4444','#e11d48'];
    classes.forEach((c,i)=>{
      const oy=H*0.5-65+i*33;
      const ca=easeOut((t-0.65-i*0.03)*3);
      const isMain=probs[i]>50;
      drawGlass(outX-50,oy-14,100,28,8,ca,isMain?cols[i]:'rgba(255,255,255,0.05)',isMain?`${cols[i]}22`:'rgba(15,23,42,0.8)');
      fadeText(`${c} ${probs[i]}%`,outX,oy,11,isMain?cols[i]:'#64748b',ca,'center',isMain?'800':'500','JetBrains Mono');
    });
  }
}

    const classes=['Normal','Mild DR','Moderate DR','Severe DR','PDR'];
    const probs=[0.05,0.04,0.87,0.03,0.01];
    const cols=['#10b981','#3b82f6','#f97316','#ef4444','#e11d48'];
    const bx=W*0.52, by=H*0.25, bw=W*0.32;
    classes.forEach((c,i)=>{
      const ba=easeOut((t-0.25-i*0.05)*2.5);
      const y=by+i*62;
      fadeText(c,bx-15,y+16,14,'#e2e8f0',ba,'right','600');
      drawBar(bx,y,bw,30,ba*probs[i],cols[i]);
      if(ba>0.4)fadeText(`${(ba*probs[i]*100).toFixed(1)}%`,bx+bw+15,y+16,14,cols[i],ba,'left','800','JetBrains Mono');
    });
  }
  
  // Verdict
  if(t>0.7){
    const va=easeOut((t-0.7)*3);
    const pulse=1+Math.sin(frame*0.1)*0.04;
    X.save();X.translate(W/2,H*0.88);X.scale(pulse,pulse);X.translate(-W/2,-H*0.88);
    drawGlass(W/2-200,H*0.88-25,400,50,25,va,'rgba(249,115,22,0.5)','rgba(249,115,22,0.08)');
    fadeText('MODERATE DIABETIC RETINOPATHY (Level 2)',W/2,H*0.88,16,'#f97316',va,'center','800');
    X.restore();
  }
}

// ─── SCENE 9: CLINICAL REPORT ───
function scene9_report(t){
  const ha=easeOut(Math.min(1,t*3));

  fadeText('CLINICAL DECISION SUPPORT & REPORT',W/2,55,22,'#3b82f6',ha,'center','700','Space Grotesk');
  
  // Report card
  const rw=Math.min(560,W*0.42), rh=H*0.72;
  const rx=W*0.08, ry=110;
  const ra=easeOut((t-0.08)*2);
  
  drawGlass(rx,ry,rw,rh,20,ra,'rgba(255,255,255,0.06)','rgba(15,23,42,0.85)');
  
  // Header band
  X.save();X.globalAlpha=ra;X.fillStyle='rgba(59,130,246,0.08)';
  roundRect(rx,ry,rw,60,20);X.fill();X.restore();
  fadeText('Diabetic Retinopathy Screening Report',rx+rw/2,ry+30,17,'#e2e8f0',ra,'center','700');
  
  const rows=[
    {l:'Patient ID',v:'#PAT-2026-4827',d:0.2},
    {l:'Exam Date',v:new Date().toLocaleDateString(),d:0.24},
    {l:'',v:''},
    {l:'DR Grade',v:'Moderate (Level 2)',d:0.32,c:'#f97316'},
    {l:'AI Confidence',v:'87.0%',d:0.36,c:'#06b6d4'},
    {l:'Calibrated',v:'Yes (Isotonic)',d:0.4,c:'#10b981'},
    {l:'',v:''},
    {l:'Microaneurysms',v:'14 detected',d:0.46,c:'#ef4444'},
    {l:'Hard Exudates',v:'8 detected',d:0.5,c:'#fbbf24'},
    {l:'Hemorrhages',v:'3 detected',d:0.54,c:'#dc2626'},
  ];
  let rowY=ry+85;
  rows.forEach(r=>{
    if(!r.l){rowY+=8;return;}
    const a=easeOut((t-r.d)*3);
    fadeText(r.l,rx+30,rowY,14,'#94a3b8',a,'left','500');
    fadeText(r.v,rx+rw-30,rowY,14,r.c||'#e2e8f0',a,'right','700');
    X.save();X.globalAlpha=a*0.08;X.strokeStyle='#fff';X.lineWidth=1;
    X.beginPath();X.moveTo(rx+25,rowY+15);X.lineTo(rx+rw-25,rowY+15);X.stroke();X.restore();
    rowY+=36;
  });
  
  // Recommendation box
  if(t>0.6){
    const rca=easeOut((t-0.6)*3);
    const blink=Math.sin(frame*0.15)>0?0.6:0.25;
    drawGlass(rx+25,rowY+10,rw-50,70,12,rca,`rgba(249,115,22,${blink})`,`rgba(249,115,22,0.06)`);
    fadeText('CLINICAL RECOMMENDATION',rx+rw/2,rowY+35,12,'#f97316',rca,'center','800');
    fadeText('Referral required. Follow up within 2-3 months.',rx+rw/2,rowY+55,14,'#e2e8f0',rca,'center','500');
  }
  
  // Right side: Ophthalmologist review flow
  if(t>0.35){
    const oa=easeOut((t-0.35)*2);
    const px=W*0.6, py=H*0.22;
    const flowSteps=[
      {n:'Automated Report',sub:'Generated in <1s',c:'#3b82f6',y:py},
      {n:'Ophthalmologist Review',sub:'Human-in-the-Loop',c:'#8b5cf6',y:py+120},
      {n:'Rapid Validation',sub:'< 30 seconds',c:'#06b6d4',y:py+240},
      {n:'Final Diagnosis',sub:'Guided Clinical Care',c:'#10b981',y:py+360}
    ];
    flowSteps.forEach((s,i)=>{
      const sa=easeOut((t-0.35-i*0.08)*2.5);
      drawGlass(px,s.y,W*0.32,80,14,sa,`${s.c}44`,`${s.c}0D`);
      fadeText(s.n,px+W*0.16,s.y+30,16,s.c,sa,'center','700');
      fadeText(s.sub,px+W*0.16,s.y+52,12,'#94a3b8',sa,'center','400');
      if(i<flowSteps.length-1){
        drawFlowArrow(px+W*0.16,s.y+80,px+W*0.16,flowSteps[i+1].y,sa*0.5,s.c);
      }
    });
  }
}

// ─── SCENE 10: SIMULINK OPTIMIZATION ───
function scene10_simulink(t){
  const ha=easeOut(Math.min(1,t*3));

  fadeText('OPERATIONAL OPTIMIZATION (SIMULINK)',W/2,55,22,'#a855f7',ha,'center','700','Space Grotesk');
  fadeText('Discrete-event simulation for deployment planning',W/2,85,14,'#64748b',ha*0.7,'center','400');
  
  // KPI cards
  const kpis=[
    {l:'Cameras',v:'18',c:'#3b82f6',icon:'📷'},
    {l:'Images/hr',v:'480',c:'#06b6d4',icon:'🖼'},
    {l:'GPU Load',v:'87%',c:'#a78bfa',icon:'⚡'},
    {l:'Patients/day',v:'520',c:'#10b981',icon:'👥'},
  ];
  const kw=Math.min(160,(W-100)/4);
  kpis.forEach((k,i)=>{
    const ka=easeOut((t-0.08-i*0.05)*2.5);
    const animV=easeOut((t-0.15-i*0.05)*1.5);
    const kx=W/2+(i-1.5)*(kw+20);
    drawGlass(kx-kw/2,H*0.18,kw,95,16,ka);
    const nV=parseFloat(k.v);
    const dV=Math.floor(animV*nV)+(k.v.includes('%')?'%':'');
    fadeText(k.icon,kx,H*0.22,18,'#fff',ka,'center','400');
    fadeText(String(dV),kx,H*0.18+48,28,k.c,ka,'center','800','JetBrains Mono');
    fadeText(k.l,kx,H*0.18+73,12,'#94a3b8',ka,'center','600');
  });
  
  // Throughput chart
  if(t>0.3){
    const ca=easeOut((t-0.3)*2);
    const cx=W*0.12, cy=H*0.48, cw=W*0.76, ch=H*0.36;
    drawGlass(cx-20,cy-20,cw+40,ch+40,20,ca);
    
    const chartP=easeOut((t-0.35)*1.5);
    const pts=60;const vPts=Math.floor(chartP*pts);
    X.save();X.globalAlpha=ca;
    
    // Grid
    X.strokeStyle='rgba(255,255,255,0.04)';X.lineWidth=1;
    for(let g=0;g<5;g++){X.beginPath();X.moveTo(cx,cy+g*(ch/4));X.lineTo(cx+cw,cy+g*(ch/4));X.stroke();}
    
    if(vPts>1){
      // Area fill
      const aGrd=X.createLinearGradient(0,cy,0,cy+ch);
      aGrd.addColorStop(0,'rgba(6,182,212,0.2)');aGrd.addColorStop(1,'rgba(6,182,212,0)');
      X.fillStyle=aGrd;X.beginPath();X.moveTo(cx,cy+ch);
      let lastPx=cx,lastPy=cy+ch;
      for(let p=0;p<vPts;p++){
        const val=Math.min(1,p/pts*1.3)*(0.8+Math.sin(p*0.3)*0.08);
        lastPx=cx+(p/(pts-1))*cw;lastPy=cy+ch-(val*ch*0.8);
        X.lineTo(lastPx,lastPy);
      }
      X.lineTo(lastPx,cy+ch);X.fill();
      
      // Line
      X.strokeStyle='#06b6d4';X.lineWidth=3;X.lineJoin='round';X.shadowColor='#06b6d4';X.shadowBlur=10;
      X.beginPath();
      for(let p=0;p<vPts;p++){
        const val=Math.min(1,p/pts*1.3)*(0.8+Math.sin(p*0.3)*0.08);
        const px=cx+(p/(pts-1))*cw,py=cy+ch-(val*ch*0.8);
        p===0?X.moveTo(px,py):X.lineTo(px,py);
        lastPx=px;lastPy=py;
      }
      X.stroke();X.shadowBlur=0;
      
      // Pulsing head
      const pulse=Math.abs(Math.sin(frame*0.1))*12;
      X.fillStyle='rgba(6,182,212,0.25)';X.beginPath();X.arc(lastPx,lastPy,8+pulse,0,7);X.fill();
      X.fillStyle='#fff';X.shadowColor='#06b6d4';X.shadowBlur=10;
      X.beginPath();X.arc(lastPx,lastPy,4,0,7);X.fill();X.shadowBlur=0;
      
      // Scanning line
      const scanX=cx+(frame%120)/120*cw;
      X.strokeStyle='rgba(168,85,247,0.4)';X.lineWidth=2;
      X.beginPath();X.moveTo(scanX,cy);X.lineTo(scanX,cy+ch);X.stroke();
      const sGrd=X.createLinearGradient(scanX-40,cy,scanX,cy);
      sGrd.addColorStop(0,'rgba(168,85,247,0)');sGrd.addColorStop(1,'rgba(168,85,247,0.15)');
      X.fillStyle=sGrd;X.fillRect(scanX-40,cy,40,ch);
    }
    
    fadeText('System Throughput (patients/hr)',cx+cw/2,cy+ch+25,12,'#64748b',ca,'center','500');
    X.restore();
  }
}

// ─── SCENE 11: CLOSING ───
function scene11_end(t){
  // Ambient orbs
  for(let i=0;i<5;i++){
    const px=Math.sin(frame*0.004+i*1.2)*W*0.35+W/2;
    const py=Math.cos(frame*0.006+i*0.8)*H*0.25+H/2;
    drawGlow(px,py,250+Math.sin(frame*0.01+i)*40,'rgb(6,182,212)',0.06);
  }
  
  const ea=easeOut(Math.min(1,t*2));
  fadeText('RetinaAI Pro',W/2,H*0.38,Math.min(56,W*0.04),'#f8fafc',ea,'center','700','Space Grotesk');
  fadeText('Saving Sight. Saving Lives.',W/2,H*0.38+45,Math.min(22,W*0.016),'#06b6d4',ea,'center','500');
  
  if(t>0.2){
    const sa=easeOut((t-0.2)*2);
    fadeText('End-to-end AI-powered screening for rural India',W/2,H*0.55,Math.min(16,W*0.012),'#94a3b8',sa,'center','400');
  }
  
  if(t>0.35){
    const ba=easeOut((t-0.35)*2);
    const stats=[{v:'94.8%',l:'Accuracy'},{v:'0.925',l:'Cohen κ'},{v:'148ms',l:'Inference'},{v:'100K+',l:'Patients/yr'}];
    const sw=Math.min(150,W*0.1);
    stats.forEach((s,i)=>{
      const sx=W/2+(i-1.5)*(sw+20);const sy=H*0.66;
      drawGlass(sx-sw/2,sy-28,sw,65,14,ba);
      fadeText(s.v,sx,sy-3,22,'#06b6d4',ba,'center','800','JetBrains Mono');
      fadeText(s.l,sx,sy+22,12,'#94a3b8',ba,'center','600');
    });
  }
  
  if(t>0.5){
    const la=easeOut((t-0.5)*2);
    fadeText('SIH 2026 · MathWorks Challenge',W/2,H*0.84,14,'#475569',la,'center','600');
  }
  
  // Expanding rings
  const rA=Math.max(0,1-(frame%120)/120);
  const rR=(frame%120)*4;
  X.save();X.strokeStyle=`rgba(6,182,212,${rA*0.12})`;X.lineWidth=2;
  X.beginPath();X.arc(W/2,H*0.42,rR,0,Math.PI*2);X.stroke();X.restore();
}

// ─── ENGINE ───
const scenes=[scene0_doctor,scene1_capture,scene2_quality,scene3_preprocess,scene4_structural,scene5_deeplearning,scene6_fusion,scene7_explainability,scene8_calibration,scene9_report,scene10_simulink,scene11_end];
function nextScene(){
  if(scene<scenes.length-1){
    tX.clearRect(0,0,W,H);tX.drawImage(C,0,0);
    scene++;sceneFrame=0;
    isTransitioning=true;transitionTime=0;transitionType=Math.floor(Math.random()*4);
  }
}

function render(){
  frame++;sceneFrame++;
  
  const currentDur=sceneDurations[Math.min(scene,sceneDurations.length-1)]||300;
  if(sceneFrame>=currentDur&&scene<scenes.length-1){
    tX.clearRect(0,0,W,H);tX.drawImage(C,0,0);
    scene++;sceneFrame=0;
    if(scene>1){isTransitioning=true;transitionTime=0;transitionType=(scene%4);}
  }
  
  X.clearRect(0,0,W,H);
  drawBg();
  
  const dur=sceneDurations[Math.min(scene,sceneDurations.length-1)]||300;
  const t=sceneFrame/dur;
  
  document.getElementById('scene-label').textContent=sceneNames[scene]||'';
  
  try{
    if(scenes[scene])scenes[scene](t);
  }catch(e){
    console.error('Scene error:',e);
  }
  
  if(isTransitioning){
    transitionTime++;
    const p=transitionTime/TRANSITION_DUR;
    const e=easeOut(p);
    X.save();
    if(transitionType===0){
      X.globalAlpha=1-e;X.drawImage(transitionCanvas,0,0);
    }else if(transitionType===1){
      X.beginPath();X.rect(0,0,W*(1-e),H);X.clip();X.drawImage(transitionCanvas,0,0);
    }else if(transitionType===2){
      X.beginPath();X.arc(W/2,H/2,Math.max(W,H)*1.5*(1-e),0,Math.PI*2);X.clip();X.drawImage(transitionCanvas,0,0);
    }else if(transitionType===3){
      if(p<0.5){X.drawImage(transitionCanvas,0,0);X.globalAlpha=p*2;X.fillStyle='#000';X.fillRect(0,0,W,H);
      }else{X.globalAlpha=1-((p-0.5)*2);X.fillStyle='#000';X.fillRect(0,0,W,H);}
    }
    X.restore();
    if(transitionTime>=TRANSITION_DUR)isTransitioning=false;
  }
  
  let totalElapsed=0;
  for(let s=0;s<scene;s++)totalElapsed+=sceneDurations[s]||300;
  totalElapsed+=sceneFrame;
  document.getElementById('progress').style.width=(totalElapsed/totalFrames*100)+'%';
  
  requestAnimationFrame(render);
}
render();
</script>
